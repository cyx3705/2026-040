[project]
name = "echo-app"
version = "0.3.0"
description = "Echo：逐词辅助的英语 AI 对话（本地自带推理引擎）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.28",
]

[project.scripts]
echo-setup = "echo_app.setup:main"
echo-upgrade = "echo_app.setup:upgrade_main"
echo-kv-adapter = "echo_app.native_kv:main"
echo-build-kernel = "echo_app.kernel_build:main"
echo-serve = "echo_app.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/echo_app"]
